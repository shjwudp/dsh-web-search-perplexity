# Layer contributed when a profile installs @shjwudp/dsh-web-search-perplexity.
#
# Neutral defaults. The API key is intentionally NOT listed here: the plugin's
# apply() reads `process.env.PERPLEXITY_API_KEY` directly, so the secret never
# lives as plaintext in a patch file and no `!!js` expression is needed.
#
# Override in the user's profile cordis.patch.yml if needed (restate all keys —
# patch rows are replaced whole):
#
#   - id: web-search-perplexity
#     config:
#       baseURL: https://api.perplexity.ai
#       model: sonar
#       maxTokens: 1024

- insert:
    - id: web-search-perplexity
      name: '@shjwudp/dsh-web-search-perplexity'
      config:
        baseURL: https://api.perplexity.ai
        model: sonar
        maxTokens: 1024
